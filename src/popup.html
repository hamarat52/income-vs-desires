<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="theme.js"></script>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="popup.css" />
    <title data-i18n="extName">IncomeVsDesires</title>
  </head>
  <body>
    <!-- Metinler _locales/<dil>/messages.json'dan gelir (lib/i18n.js localizePage). -->
    <header>
      <h1 data-i18n="extName">IncomeVsDesires</h1>
      <label class="switch">
        <input type="checkbox" id="enabled" role="switch" />
        <span id="enabledLabel"></span>
      </label>
    </header>

    <label class="field">
      <span data-i18n="popupSalaryLabel"></span>
      <div class="row">
        <input type="text" id="salary" inputmode="numeric" autocomplete="off" data-i18n-placeholder="salaryPlaceholder" />
        <select id="currency"></select>
      </div>
    </label>

    <div class="field">
      <span data-i18n="popupScheduleLabel"></span>
      <div class="row">
        <label class="sub">
          <input type="number" id="hoursPerDay" min="1" max="24" step="any" placeholder="8" />
          <small data-i18n="hoursPerDayShort"></small>
        </label>
        <label class="sub">
          <input type="number" id="daysPerMonth" min="1" max="31" step="any" placeholder="22" />
          <small data-i18n="daysPerMonthShort"></small>
        </label>
      </div>
    </div>

    <div class="field">
      <span data-i18n="popupDisplayLabel"></span>
      <label class="switch option">
        <input type="checkbox" id="basisLeftover" role="switch" />
        <span data-i18n="basisLeftoverLabel"></span>
      </label>
      <label class="switch option">
        <input type="checkbox" id="showBoth" role="switch" />
        <span data-i18n="showBothLabel"></span>
      </label>
      <label class="switch option">
        <input type="checkbox" id="calendarDays" role="switch" />
        <span data-i18n="calendarDaysLabel"></span>
      </label>
    </div>

    <p class="rate" id="rate"></p>
    <p class="note" id="basisNote" hidden></p>

    <div class="actions">
      <button type="button" id="openOptions" class="primary" data-i18n="openOptions"></button>
      <button type="button" id="rescan" class="ghost" data-i18n="rescan"></button>
      <button type="button" id="toggleHost" class="ghost"></button>
    </div>

    <footer id="rateInfo"></footer>

    <script src="lib/i18n.js"></script>
    <script src="lib/money.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
