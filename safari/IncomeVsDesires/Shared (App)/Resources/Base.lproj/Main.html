<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <!-- Metinler Script.js'te TR/EN; dil navigator.language'dan (tr* → Türkçe, diğerleri İngilizce). -->
    <img src="../Icon.png" width="128" height="128" alt="IncomeVsDesires" data-i18n-alt="iconAlt">
    <p class="platform-ios" data-i18n="ios"></p>
    <p class="platform-mac state-unknown" data-i18n="macUnknown"></p>
    <p class="platform-mac state-on" data-i18n="macOn"></p>
    <p class="platform-mac state-off" data-i18n="macOff"></p>
    <button class="platform-mac open-preferences" data-i18n="openPreferences"></button>
</body>
</html>
