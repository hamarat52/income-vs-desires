<!DOCTYPE html>
<!--
  Marquee tanıtım görseli (1400×560, Chrome Web Store "Marquee promo tile", isteğe bağlı).
  Marka: yeşil #43e08c → #0c9a6c, ikon src/icons/icon-128.png (terazi glyph).
  Örnek hesap MAGAZA-LISTELEME.md ile aynı: 50.000 TL · 8 saat · 22 gün →
  saatlik 284,09 TL; 500 TL → 1,8 saat. Site/marka logosu kullanılmaz.
-->
<html lang="tr">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #43e08c 0%, #0c9a6c 100%);
    color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box; padding: 0 110px; display: grid; grid-template-columns: 1fr 470px;
    align-items: center; gap: 70px;
  }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 34px; }
  .brand img { width: 76px; height: 76px; border-radius: 18px; box-shadow: 0 8px 24px rgba(6, 60, 40, 0.3); }
  .brand span { font: 700 30px/1 ui-monospace, "SFMono-Regular", Menlo, monospace; letter-spacing: -0.4px; }
  h1 { font-size: 68px; line-height: 1.04; font-weight: 800; margin: 0 0 22px; letter-spacing: -1.6px; }
  p { font-size: 25px; line-height: 1.4; margin: 0; color: rgba(255, 255, 255, 0.92); max-width: 620px; }
  .card { background: #fbf9f4; color: #17150f; border-radius: 18px; padding: 34px 38px;
          box-shadow: 0 24px 60px rgba(6, 60, 40, 0.32); }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0;
         border-bottom: 1px solid #e8e3d6; font: 600 27px/1 ui-monospace, "SFMono-Regular", Menlo, monospace; }
  .row:last-child { border-bottom: 0; }
  .row s { color: #8b857a; font-weight: 500; }
  .row b { color: #0c9a6c; }
  .label { font: 700 14px/1 ui-monospace, "SFMono-Regular", Menlo, monospace; letter-spacing: 2px; color: #8b857a;
           text-transform: uppercase; margin-bottom: 6px; }
</style>
</head>
<body>
  <div>
    <div class="brand"><img src="../../../src/icons/icon-128.png" alt="" /><span>IncomeVsDesires</span></div>
    <h1>Fiyatı değil,<br />mesaini gör.</h1>
    <p>Maaşını gir; internetteki fiyatlar kaç saat çalıştığına dönüşsün. Kayıt yok, veri toplamaz, ücretsiz.</p>
  </div>
  <div class="card">
    <div class="label">50.000 TL · 8 saat · 22 gün</div>
    <div class="row"><s>500 TL</s><b>1,8 saat</b></div>
    <div class="row"><s>2.499 TL</s><b>1,1 gün</b></div>
    <div class="row"><s>50.000 TL</s><b>1 ay</b></div>
  </div>
</body>
</html>
